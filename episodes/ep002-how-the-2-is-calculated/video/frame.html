<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#0E161D}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;background:#0E161D}
  svg{position:absolute;inset:0}
  text{font-family:"Noto Sans CJK SC","PingFang SC",sans-serif}
  .mono{font-family:"SF Mono",Menlo,monospace}
</style>
<script src="data.js"></script>
</head><body>
<div id="stage"><svg id="svg" width="1920" height="1080" viewBox="0 0 1920 1080"></svg></div>
<script>
/* ---------- 全系列配色：一个颜色只有一个意思 ---------- */
const C = {
  bg:'#0E161D', card:'#16212a', edge:'#2c3a45',
  steel:'#8FB3C8',          // 正常、基线、柱子
  gold:'#F0B429',           // 临时焦点
  push:'#4fa3ef',           // 推动（激活）
  press:'#e4572e',          // 压住（抑制）
  hand:'#a78bfa',           // 人为干预（扰动）
  off:'#4a5863',            // 被关掉
  t1:'#F2F5F7', t2:'#cfd8de', t3:'#8a96a0', eb:'#7f8b95'
};
let STR = {}, SUBS = [], SEC = [], ANCH = [];   // 由 render.py 注入：文字、字幕、各节起止、各节每行旁白的起点（节内秒）
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const CJK=s=>/[\u4e00-\u9fff]/.test(s);
// 西文长句按单词折成多行（中文不走这里，保持原样）
function wrapLatin(s,n){const L=[];let l='';for(const w of s.split(' ')){if(l&&(l+' '+w).length>n){L.push(l);l=w;}else l=l?l+' '+w:w;}if(l)L.push(l);return L;}
const ease=x=>1-Math.pow(1-clamp(x),3);
const io=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const ramp=(t,a,b)=>clamp((t-a)/(b-a));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function T(x,y,s,{size=32,fill=C.t1,w=500,anchor='start',op=1,mono=false,ls=0}={}){
  return `<text x="${x}" y="${y}" font-size="${size}" fill="${fill}" font-weight="${w}" text-anchor="${anchor}" opacity="${op}" ${mono?'class="mono"':''} letter-spacing="${ls}">${esc(s)}</text>`;
}
function R(x,y,w,h,{fill=C.card,stroke=C.edge,sw=2,r=14,op=1,dash=''}={}){
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" opacity="${op}" ${dash?`stroke-dasharray="${dash}"`:''}/>`;
}
function sim(name,tt){const s=SIM[name];const i=clamp(tt/s.dt,0,s.x.length-1);const a=Math.floor(i),b=Math.min(a+1,s.x.length-1),f=i-a;return s.x[a].map((v,k)=>v+(s.x[b][k]-v)*f);}

/* ---------- 常驻元素 ---------- */
function chrome(t,title,titleOp=1){
  let s=T(96,84,STR.eyebrow,{size:24,fill:C.eb,mono:true,ls:3});
  s+=T(1824,84,STR.schematic,{size:24,fill:C.eb,anchor:'end'});
  if(title) s+=T(96,168,title,{size:58,w:900,op:titleOp});
  const total=SEC[SEC.length-1][1];
  s+=`<rect x="0" y="1074" width="${1920*clamp(t/total)}" height="6" fill="${C.steel}"/>`;
  return s;
}
function subtitle(t){
  const cur=SUBS.find(x=>t>=x[0]&&t<x[1]); if(!cur) return '';
  const txt=cur[2];
  if(!/[\u4e00-\u9fff]/.test(txt)){ // 西文：按单词折行，每行 ≤ 64 字符；超过两行则按字数比例分页显示
    const nL=Math.ceil(txt.length/64), lines=wrapLatin(txt,Math.min(64,Math.ceil(txt.length/nL)+6)); // 行长均衡，避免单词落单
    const pages=[]; for(let i=0;i<lines.length;i+=2) pages.push(lines.slice(i,i+2));
    const tot=txt.length, el=(t-cur[0])/(cur[1]-cur[0])*tot; let acc=0,pg=pages[pages.length-1];
    for(const P of pages){acc+=P.join(' ').length+1; if(el<acc){pg=P;break;}}
    if(pg.length===1) return T(960,1000,pg[0],{size:40,anchor:'middle'});
    return T(960,972,pg[0],{size:40,anchor:'middle'})+T(960,1030,pg[1],{size:40,anchor:'middle'});
  }
  if(txt.length<=30) return T(960,1000,txt,{size:42,anchor:'middle'});
  const mid=txt.length/2; let cut=-1,best=1e9;
  for(let i=0;i<txt.length;i++) if('，、：；'.includes(txt[i])&&Math.abs(i-mid)<best){best=Math.abs(i-mid);cut=i+1;}
  if(cut<0) cut=Math.ceil(mid);
  return T(960,972,txt.slice(0,cut),{size:42,anchor:'middle'})+T(960,1030,txt.slice(cut),{size:42,anchor:'middle'});
}

/* ---------- 组件：输入—输出机器 ---------- */
function machine(cx,cy,{p=1,rules=0,inState=null,inPert=null,out=null,labels=true}={}){
  let s='';
  const w=360,h=230;
  s+=R(cx-w/2,cy-h/2,w,h,{fill:'#1b2833',stroke:C.steel,sw:3,r:22,op:ease(p)});
  s+=T(cx,cy-h/2+52,STR.machine,{size:40,w:900,anchor:'middle',op:ease(p)});
  if(rules>0){ // 机器内部亮出三条规则
    const o=ease(rules), y=cy+30;
    s+=`<g opacity="${o}">`+miniNet(cx,y,0.62)+`</g>`;
    s+=T(cx,cy+h/2-14,STR.rules_inside,{size:24,fill:C.gold,anchor:'middle',op:o});
  }
  if(labels){
    const lp=ease(p*1.4-0.2);
    // 左侧两入口
    s+=arrow(cx-w/2-230,cy-60,cx-w/2-10,cy-60,C.steel,lp);
    s+=arrow(cx-w/2-230,cy+60,cx-w/2-10,cy+60,C.hand,lp);
    s+=T(cx-w/2-240,cy-72,STR.in_state,{size:30,anchor:'end',op:lp});
    s+=T(cx-w/2-240,cy+70,STR.in_pert,{size:30,anchor:'end',fill:C.hand,op:lp});
    s+=arrow(cx+w/2+10,cy,cx+w/2+230,cy,C.steel,lp);
    s+=T(cx+w/2+240,cy+10,STR.out_state,{size:30,op:lp});
  }
  if(inState) s+=bars3(cx-w/2-330,cy-110,inState,{scale:40,gap:44,bw:30,op:1,labels:false});
  if(out) s+=bars3(cx+w/2+300,cy-30,out,{scale:40,gap:44,bw:30,op:1,labels:false});
  return s;
}
function arrow(x1,y1,x2,y2,col,op=1,sw=4){
  const a=Math.atan2(y2-y1,x2-x1),L=16;
  const p1=[x2-L*Math.cos(a-0.45),y2-L*Math.sin(a-0.45)],p2=[x2-L*Math.cos(a+0.45),y2-L*Math.sin(a+0.45)];
  return `<g opacity="${op}"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${sw}" stroke-linecap="round"/><path d="M${p1} L${x2},${y2} L${p2}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"/></g>`;
}
function tbar(x1,y1,x2,y2,col,op=1,sw=4){ // 丁字头 ⊣
  const a=Math.atan2(y2-y1,x2-x1),L=16,nx=-Math.sin(a),ny=Math.cos(a);
  return `<g opacity="${op}"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${sw}" stroke-linecap="round"/><line x1="${x2+nx*L}" y1="${y2+ny*L}" x2="${x2-nx*L}" y2="${y2-ny*L}" stroke="${col}" stroke-width="${sw+1}" stroke-linecap="round"/></g>`;
}

/* ---------- 组件：玩具细胞网络 ---------- */
const NODE={A:[0,0],B:[1,0],C:[2,0]};
function net(ox,oy,sp,{op=1,showA=1,showB=1,showC=1,arAB=1,arBC=1,arCA=1,off={},r=46,font=40,pressOp=1}={}){
  let s='';
  const P=k=>[ox+NODE[k][0]*sp,oy];
  const [ax,ay]=P('A'),[bx,by]=P('B'),[cx,cy]=P('C');
  if(arAB>0) s+=arrow(ax+r+8,ay,ax+(bx-ax-2*r-16)*ease(arAB)+r+8,by,C.push,op*Math.min(1,arAB*3));
  if(arBC>0) s+=arrow(bx+r+8,by,bx+(cx-bx-2*r-16)*ease(arBC)+r+8,cy,(off.B||off.C)?C.off:C.push,op*Math.min(1,arBC*3));
  if(arCA>0){ // 从 C 上方绕回 A
    const k=ease(arCA), top=ay-150;
    const d=`M${cx},${cy-r-8} C${cx},${top} ${ax},${top} ${ax},${ay-r-24}`;
    s+=`<path d="${d}" fill="none" stroke="${off.C?C.off:C.press}" stroke-width="4" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1-k}" opacity="${op*pressOp}"/>`;
    if(k>0.95) s+=`<line x1="${ax-18}" y1="${ay-r-24}" x2="${ax+18}" y2="${ay-r-24}" stroke="${off.C?C.off:C.press}" stroke-width="5" stroke-linecap="round" opacity="${op*pressOp}"/>`;
  }
  for(const [k,sh] of [['A',showA],['B',showB],['C',showC]]){
    if(sh<=0) continue;
    const [x,y]=P(k), isOff=off[k]||0;
    const col=isOff>0.5?C.off:C.t1;
    s+=`<circle cx="${x}" cy="${y}" r="${r*ease(sh)}" fill="#1b2833" stroke="${isOff>0.5?C.off:C.steel}" stroke-width="3" opacity="${op}"/>`;
    s+=T(x,y+font*0.36,k,{size:font,w:900,anchor:'middle',fill:col,op:op*ease(sh)});
  }
  return s;
}
function miniNet(cx,cy,sc){
  return `<g transform="translate(${cx-120*sc*2},${cy}) scale(${sc})">`+net(0,40,240,{r:40,font:34})+`</g>`;
}
/* 柱子：值 → 高度；幽灵虚线 = 之前 */
function bars3(x0,yBase,vals,{scale=120,gap=240,bw=90,op=1,ghost=null,labels=true,offK={},hl=null,nolab={}}={}){
  let s='';
  vals.forEach((v,i)=>{
    const x=x0+i*gap-bw/2, h=Math.max(0,v)*scale, k='ABC'[i];
    if(ghost) s+=`<rect x="${x}" y="${yBase-ghost[i]*scale}" width="${bw}" height="${ghost[i]*scale}" fill="none" stroke="${C.t3}" stroke-width="2" stroke-dasharray="8 6" opacity="${op}"/>`;
    const col=offK[k]?C.off:(hl===k?C.gold:C.steel);
    s+=`<rect x="${x}" y="${yBase-h}" width="${bw}" height="${h}" fill="${col}" opacity="${op}" rx="4"/>`;
    if(labels&&!nolab[k]) s+=T(x+bw/2,yBase-h-16,(v<0.05?'0':v.toFixed(1)),{size:34,anchor:'middle',fill:hl===k?C.gold:C.t2,op,mono:true});
  });
  s+=`<line x1="${x0-bw}" y1="${yBase}" x2="${x0+2*gap+bw}" y2="${yBase}" stroke="${C.edge}" stroke-width="3" opacity="${op}"/>`;
  return s;
}

/* ================= 第 2 期 ================= */
/* 节拍锚点：每个节拍挂在"第 j 行旁白"开始后、到下一行之间的比例 a 处。
   ANCH[i][j] = 第 i 节第 j 行旁白开始的节内秒数（中英各自从 cues 算出，逐行对应）。 */
let CUR=0;
const LN=j=>{const A=ANCH[CUR]||[];return j<A.length?A[j]:SEC[CUR][1]-SEC[CUR][0];};
const AT=(j,a=0)=>LN(j)+a*(LN(j+1)-LN(j));
const ON=(lt,j,a=0,dur=0.5)=>ease(ramp(lt,AT(j,a),AT(j,a)+dur));
const IN=(lt,j,a=0)=>lt>=AT(j,a);
const OFF=(lt,j,a=0,dur=0.4)=>1-ease(ramp(lt,AT(j,a),AT(j,a)+dur));
const pulse=(lt,t0,dur=1.4)=>lt<t0||lt>t0+dur?0:Math.sin(Math.PI*(lt-t0)/dur);

function TS(x,y,parts,{size=40,anchor='start',w=700,mono=false}={}){
  return `<text x="${x}" y="${y}" font-size="${size}" font-weight="${w}" text-anchor="${anchor}" ${mono?'class="mono"':''}>`+
    parts.map(([str,fill,op=1])=>`<tspan fill="${fill}" opacity="${op}">${esc(str)}</tspan>`).join('')+`</text>`;
}
function wrapT(x,y,str,{size=34,fill=C.t1,w=500,anchor='start',op=1,n=40,lh=1.35}={}){ // 中文原样，西文按词折行
  if(CJK(str)) return T(x,y,str,{size,fill,w,anchor,op});
  return wrapLatin(str,n).map((l,k)=>T(x,y+k*size*lh,l,{size,fill,w,anchor,op})).join('');
}
function src(x,y,key,op=1,anchor='start'){ return T(x,y,STR.src[key],{size:28,fill:C.t3,op,anchor}); }
/* 竖排分数：分子 / 分数线 / 分母，各自可单独点亮 */
function frac(cx,y,num,den,{size=44,opN=1,opD=1,colN=C.t1,colD=C.t1,op=1}={}){
  const w=Math.max(num.length,den.length)*size*0.62+30;
  return T(cx,y-16,num,{size,anchor:'middle',mono:true,fill:colN,op:op*opN,w:700})+
    `<line x1="${cx-w/2}" y1="${y}" x2="${cx+w/2}" y2="${y}" stroke="${C.t2}" stroke-width="3" opacity="${op}"/>`+
    T(cx,y+size+8,den,{size,anchor:'middle',mono:true,fill:colD,op:op*opD,w:700});
}
function xmark(x,y,o,sz=40){ return `<g opacity="${o}"><line x1="${x-sz}" y1="${y-sz}" x2="${x+sz}" y2="${y+sz}" stroke="${C.hand}" stroke-width="7" stroke-linecap="round"/><line x1="${x+sz}" y1="${y-sz}" x2="${x-sz}" y2="${y+sz}" stroke="${C.hand}" stroke-width="7" stroke-linecap="round"/></g>`; }
function dashLine(x1,x2,y,col,op=1,lab=null){ let s=`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${col}" stroke-width="3" stroke-dasharray="12 9" opacity="${op}"/>`; if(lab) s+=T(x2+14,y+11,lab,{size:30,fill:col,op,mono:true,w:700}); return s; }
function legend(x,y,op=1){
  return arrow(x,y,x+70,y,C.push,op)+T(x+90,y+10,STR.legend_push,{size:28,op})+
    tbar(x,y+50,x+70,y+50,C.press,op)+T(x+90,y+60,STR.legend_press,{size:28,op});
}
/* 光点沿直线流动：rate 越大越密 */
function flow(x1,y1,x2,y2,rate,lt,col,op=1){
  if(rate<=0.02||op<=0) return '';
  const L=Math.hypot(x2-x1,y2-y1), gap=56/rate, off=(lt*90)%gap; let s='';
  for(let d=off;d<L;d+=gap){const u=d/L; s+=`<circle cx="${x1+(x2-x1)*u}" cy="${y1+(y2-y1)*u}" r="7" fill="${col}" opacity="${op}"/>`;}
  return s;
}
/* 左半边：三点三柱（第四、五节共用） */
const LX=210,LY=330,LSP=260,LBY=820,LSC=110;
function leftCell(lt,{vals=[1,1,1],off={},ghost=null,hl=null,hiPress=0,hiPush=0,op=1,labels=true,nolab={}}={}){
  let s=net(LX,LY,LSP,{r:42,font:36,off,op});
  if(hiPress>0) s+=`<g opacity="${hiPress*op}">`+`<path d="M${LX+2*LSP},${LY-50} C${LX+2*LSP},${LY-150} ${LX},${LY-150} ${LX},${LY-66}" fill="none" stroke="${C.gold}" stroke-width="11" stroke-opacity="0.6" stroke-linecap="round"/></g>`;
  if(hiPush>0) s+=`<line x1="${LX+50}" y1="${LY}" x2="${LX+LSP-50}" y2="${LY}" stroke="${C.gold}" stroke-width="14" stroke-opacity="${0.6*hiPush*op}" stroke-linecap="round"/>`;
  for(const k of Object.keys(off)) if(off[k]) s+=xmark(LX+'ABC'.indexOf(k)*LSP,LY,op,34);
  s+=bars3(LX,LBY,vals,{scale:LSC,gap:LSP,bw:90,ghost,offK:off,hl,op,labels,nolab});
  ['A','B','C'].forEach((k,i)=>s+=T(LX+i*LSP,LBY+40,k,{size:26,fill:C.t3,anchor:'middle',w:700,op}));
  return s;
}
function card(op=1){ return R(880,230,960,690,{op,fill:'#131d25'}); }
const topY=v=>LBY-v*LSC;   // 柱顶 y

/* ---------- 一、上期的答案 ---------- */
function sec1(t,lt,d){
  let s=chrome(t,IN(lt,2)?STR.titles.s1b:STR.titles.s1);
  const NX=560,NY=400,SP=400,BY=840;
  const offC=IN(lt,0,0.62)?1:0;
  s+=net(NX,NY,SP,{arAB:ramp(lt,AT(0,0.03),AT(0,0.12)),arBC:ramp(lt,AT(0,0.09),AT(0,0.18)),arCA:ramp(lt,AT(0,0.15),AT(0,0.27)),off:{C:offC}});
  s+=T(96,250,STR.toy_tag,{size:26,fill:C.t3});
  s+=legend(1500,250,ease(ramp(lt,AT(0,0.03),AT(0,0.12))));
  s+=T(96,300,STR.bar_meaning,{size:26,fill:C.steel,op:ON(lt,0,0.3)});
  let vals=NUM.rest, ghost=null;
  if(IN(lt,1)){vals=sim('koC',ramp(lt,AT(1,0.0),AT(1,0.9))*9); ghost=[1,1,1];}
  const gapOn=IN(lt,1,0.55);
  s+=bars3(NX,BY,vals,{scale:120,gap:SP,bw:110,ghost,offK:{C:offC},nolab:gapOn?{B:1}:{}});
  if(gapOn) s+=T(NX+SP-70,BY-vals[1]*120+12,vals[1].toFixed(1),{size:34,anchor:'end',fill:C.gold,mono:true,w:700});
  if(offC){const o=ON(lt,0,0.62); s+=xmark(NX+2*SP,NY,o); s+=T(NX+2*SP,NY+100,STR.ko+' C',{size:30,fill:C.hand,anchor:'middle',op:o});}
  if(IN(lt,1,0.55)){ // 上限 2 的虚线 + 空隙
    const o=ON(lt,1,0.55), x=NX+SP, y2=BY-2*120, y16=BY-vals[1]*120;
    s+=dashLine(x-90,x+90,y2,C.t2,o,'2');
    s+=T(x+130,y2+46,STR.cap_note,{size:26,fill:C.t2,op:o});
    const g=0.18+0.6*pulse(lt,AT(2,0),1.6);
    s+=`<rect x="${x-55}" y="${y2}" width="110" height="${Math.max(0,y16-y2)}" fill="${C.gold}" opacity="${o*g}"/>`;
  }
  if(IN(lt,2,0.55)) s+=T(1500,600,STR.only_arith,{size:34,fill:C.gold,anchor:'middle',op:ON(lt,2,0.55),w:700});
  return s;
}
/* ---------- 二、今天讲机器的哪一块 ---------- */
function sec2(t,lt,d){
  let s=chrome(t,STR.titles.s2);
  s+=machine(960,560,{p:1,labels:false});
  const pos=[[560,380],[560,740],[1360,380],[1360,740]];
  STR.map.forEach((m,i)=>{
    let o=ON(lt,0,0.30+i*0.15), focus=IN(lt,1);
    const st=focus&&i==2?C.gold:C.edge, fill=focus&&i==2?C.gold:C.t1;
    if(focus&&i!=2) o*=1-0.65*ON(lt,1,0);
    s+=R(pos[i][0]-190,pos[i][1]-45,380,90,{op:o,r:45,stroke:st,sw:focus&&i==2?4:2});
    s+=T(pos[i][0],pos[i][1]+12,m,{size:CJK(m)?32:28,anchor:'middle',op:o,fill});
  });
  if(IN(lt,1)) s+=T(960,920,STR.today,{size:34,fill:C.gold,anchor:'middle',op:ON(lt,1,0.3)});
  return s;
}
/* ---------- 三、柱子为什么会停下来 ---------- */
function tub(lt,v,pin,pout,{op=1,x=520,base=800,sc=140,bw=140,labels=false,inlet=true}={}){
  let s='';
  // 进水口（左上）与出水口（右下）
  if(inlet) s+=`<path d="M${x-260},${base-400} L${x},${base-400} L${x},${base-370}" fill="none" stroke="${C.edge}" stroke-width="16" stroke-linejoin="round" opacity="${op}"/>`;
  s+=`<path d="M${x+bw/2},${base-14} L${x+bw/2+230},${base-14}" fill="none" stroke="${C.edge}" stroke-width="16" opacity="${op}"/>`;
  if(inlet) s+=flow(x-250,base-400,x-8,base-400,pin,lt,C.steel,op);
  s+=flow(x+bw/2+6,base-14,x+bw/2+226,base-14,pout,lt,C.t3,op);
  if(inlet) s+=`<path d="M${x-bw/2-26},${base-320} L${x-bw/2-26},${base+4} L${x+bw/2+26},${base+4} L${x+bw/2+26},${base-320}" fill="none" stroke="${C.t3}" stroke-width="5" stroke-linejoin="round" opacity="${op}"/>`;
  const h=v*sc;
  s+=`<rect x="${x-bw/2}" y="${base-h}" width="${bw}" height="${h}" fill="${C.steel}" rx="4" opacity="${op}"/>`;
  s+=`<line x1="${x-bw/2-40}" y1="${base}" x2="${x+bw/2+40}" y2="${base}" stroke="${C.edge}" stroke-width="3" opacity="${op}"/>`;
  s+=T(x,base-h-16,v<0.05?'0':v.toFixed(1),{size:34,anchor:'middle',fill:C.t2,mono:true,op});
  s+=T(x,base+40,'A',{size:26,fill:C.t3,anchor:'middle',w:700,op});
