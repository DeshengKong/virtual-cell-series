[project]
name = "toycell"
version = "0.1.0"
description = "《虚拟细胞：从零到前沿》系列共用的 3 基因玩具细胞"
requires-python = ">=3.9"
dependencies = ["numpy"]
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
